<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Republic Quant Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #07080a;
      --surface: #0d0f13;
      --surface2: #131720;
      --border: #1e2535;
      --accent: #00e5a0;
      --red: #ff4d6d;
      --amber: #f5a623;
      --blue: #4a9eff;
      --text: #c8d4e8;
      --muted: #4a5568;
      --mono: 'IBM Plex Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      min-height: 100vh;
      padding-bottom: 36px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .07) 2px, rgba(0, 0, 0, .07) 4px);
      pointer-events: none;
      z-index: 1000;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: var(--accent);
      opacity: .15;
    }

    .logo-text {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .08em;
      color: #fff;
    }

    .logo-sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      color: var(--accent);
      letter-spacing: .1em;
    }

    .timestamp {
      font-size: 10px;
      color: var(--muted);
    }

    .btn {
      padding: 6px 14px;
      font-size: 10px;
      font-family: var(--mono);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      letter-spacing: .08em;
      transition: all .15s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn-accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-accent:hover {
      background: rgba(0, 229, 160, .08);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 24px;
      overflow-x: auto;
    }

    .tab {
      padding: 10px 16px;
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .15s;
      font-family: var(--mono);
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-ml {
      color: var(--blue) !important;
      opacity: 0.7;
    }

    .tab-ml:hover, .tab-ml.active {
      color: var(--blue) !important;
      border-bottom-color: var(--blue) !important;
      opacity: 1;
    }

    #page-container {
      padding: 20px 24px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .page-enter {
      animation: fadeIn .22s ease;
    }

    .page-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .1em;
    }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }

    .kpi::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--kpi-color, var(--accent));
    }

    .kpi-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--kpi-color, #fff);
      line-height: 1;
    }

    .kpi-sub {
      font-size: 9px;
      color: var(--muted);
      margin-top: 4px;
    }

    .kpi-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 6px;
      margin-top: 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      letter-spacing: .06em;
    }

    .c-green {
      --kpi-color: var(--accent);
    }

    .c-red {
      --kpi-color: var(--red);
    }

    .c-amber {
      --kpi-color: var(--amber);
    }

    .c-blue {
      --kpi-color: var(--blue);
    }

    .c-muted {
      --kpi-color: #6c7a9c;
    }

    .signal-box {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
      margin-bottom: 14px;
      border-left: 3px solid var(--signal-color, var(--accent));
    }

    .signal-title {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .signal-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--signal-color, var(--accent));
      white-space: pre-line;
    }

    .signal-reasons {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .signal-reason {
      font-size: 10px;
      color: var(--muted);
      padding: 2px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--text);
    }

    .panel-tag {
      font-size: 9px;
      padding: 2px 7px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: .08em;
    }

    .panel-body {
      padding: 16px;
    }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s;
      position: relative;
    }

    .stat-box:hover {
      border-color: var(--accent);
    }

    .stat-box::after {
      content: '↗';
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 9px;
      color: var(--muted);
      opacity: .6;
    }

    .stat-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .1em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .stat-sub {
      font-size: 9px;
      color: var(--muted);
      line-height: 1.5;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--muted);
      text-align: left;
      padding: 0 8px 10px 0;
      border-bottom: 1px solid var(--border);
      font-weight: 400;
    }

    .data-table td {
      padding: 9px 8px 9px 0;
      font-size: 11px;
      border-bottom: 1px solid rgba(30, 37, 53, .5);
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .1em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
      transition: border-color .15s;
      appearance: none;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--accent);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .form-submit {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      cursor: pointer;
      transition: all .15s;
      margin-top: 6px;
    }

    .form-submit:hover {
      background: rgba(0, 229, 160, .08);
    }

    .form-submit-red {
      border-color: var(--red);
      color: var(--red);
    }

    .form-submit-red:hover {
      background: rgba(255, 77, 109, .08);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      letter-spacing: .06em;
    }

    .tag-green {
      background: rgba(0, 229, 160, .1);
      color: var(--accent);
    }

    .tag-red {
      background: rgba(255, 77, 109, .1);
      color: var(--red);
    }

    .tag-amber {
      background: rgba(245, 166, 35, .1);
      color: var(--amber);
    }

    .tag-muted {
      background: rgba(74, 85, 104, .15);
      color: var(--muted);
    }

    .tag-blue {
      background: rgba(74, 158, 255, .12);
      color: var(--blue);
    }

    .tips li {
      list-style: none;
      font-size: 11px;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid rgba(30, 37, 53, .5);
      line-height: 1.5;
    }

    .tips li:last-child {
      border-bottom: none;
    }

    .tips strong {
      color: var(--text);
      font-weight: 500;
    }

    .msg {
      padding: 8px 12px;
      font-size: 10px;
      border: 1px solid;
      margin: 10px 0;
      letter-spacing: .04em;
    }

    .msg-success {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 229, 160, .06);
    }

    .msg-error {
      border-color: var(--red);
      color: var(--red);
      background: rgba(255, 77, 109, .06);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 90%;
      max-width: 560px;
      max-height: 82vh;
      overflow-y: auto;
      animation: fadeIn .2s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 12px;
      letter-spacing: .1em;
      color: #fff;
    }

    .modal-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      font-family: var(--mono);
    }

    .modal-close:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-metric {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .modal-section {
      margin-bottom: 16px;
    }

    .modal-section-title {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .modal-section-body {
      font-size: 11px;
      color: var(--text);
      line-height: 1.7;
      background: var(--surface2);
      padding: 12px;
      border-left: 2px solid var(--border);
    }

    .formula {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      background: var(--bg);
      padding: 12px;
      border: 1px dashed var(--border);
      white-space: pre;
      line-height: 1.6;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 5px 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 900;
    }

    .footer-item {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .footer-item span {
      color: var(--text);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-mark">Ψ</div>
      <div>
        <div class="logo-text">QUANT ENGINE</div>
        <div class="logo-sub">TRADE REPUBLIC · LOCAL</div>
      </div>
    </div>
    <div class="header-right">
      <div class="badge-live">
        <div class="live-dot"></div>LIVE
      </div>
      <div class="timestamp" id="timestamp">—</div>
      <button class="btn btn-accent" onclick="refreshData()" id="refreshBtn">⟳ REFRESH</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview',     this)">OVERVIEW</button>
    <button class="tab"        onclick="switchTab('analytics',    this)">ANALYTICS</button>
    <button class="tab"        onclick="switchTab('risk',         this)">RISK</button>
    <button class="tab"        onclick="switchTab('holdings',     this)">HOLDINGS</button>
    <button class="tab"        onclick="switchTab('trades',       this)">LOG TRADE</button>
    <button class="tab"        onclick="switchTab('research',     this)">RESEARCH</button>
    <button class="tab"        onclick="switchTab('benchmark',    this)">BENCHMARK</button>
    <button class="tab"        onclick="switchTab('history',      this)">HISTORY</button>
    <button class="tab tab-ml" onclick="switchTab('ml_research',  this)">⬡ ML RESEARCH</button>
  </div>

  <div id="msgGlobal" style="padding:0 24px;"></div>
  <div id="page-container">
    <div class="page-loading">LOADING ENGINE DATA...</div>
  </div>

  <div id="metricModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">—</div>
        <button class="modal-close" onclick="closeMetricInfo()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-metric" id="modalValue">—</div>
        <div class="modal-section">
          <div class="modal-section-title">FORMULA</div>
          <div class="formula" id="modalFormula">—</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">WHAT IT MEANS</div>
          <div class="modal-section-body" id="modalMeaning">—</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">WHY IT MATTERS</div>
          <div class="modal-section-body" id="modalImportance">—</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">TARGET</div>
          <div class="modal-section-body" id="modalTarget">—</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-item">ENGINE <span id="ftEngine">—</span></div>
    <div class="footer-item">NEXT REBALANCE <span id="ftRebalance">—</span></div>
    <div class="footer-item">ASSETS <span id="ftAssets">—</span></div>
    <div class="footer-item">RF RATE <span>2.0%</span></div>
    <div class="footer-item">FX USD/EUR <span id="ftFxRate">—</span></div>
    <div class="footer-item" style="margin-left:auto;">DRIFT ±5%/+7% · MIN TRADE €25 · 200D MA FILTER</div>
  </footer>

  <script src="js/charts.js"></script>
  <script src="js/engine.js"></script>
  <script>
    const _pageCache = {};
    let _activeTab = null;

    async function switchTab(name, btnEl) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      if (_activeTab === name) return;
      _activeTab = name;

      const container = document.getElementById('page-container');
      if (!_pageCache[name]) {
        container.innerHTML = '<div class="page-loading">LOADING ' + name.toUpperCase() + '...</div>';
      }

      if (!_pageCache[name]) {
        try {
          const r = await fetch('pages/' + name + '.html?' + Date.now());
          if (!r.ok) throw new Error('Could not load pages/' + name + '.html');
          _pageCache[name] = await r.text();
        } catch (e) {
          container.innerHTML = '<div class="page-loading" style="color:var(--red)">&#9888; ' + e.message + '</div>';
          return;
        }
      }

      container.innerHTML = '<div class="page-enter">' + _pageCache[name] + '</div>';

      // Re-execute injected <script> blocks (innerHTML doesn't run them)
      container.querySelectorAll('script').forEach(oldScript => {
        const s = document.createElement('script');
        s.textContent = oldScript.textContent;
        document.head.appendChild(s).parentNode.removeChild(s);
      });

      if (window.engineData && typeof window._pageInit === 'function') {
        window._pageInit(window.engineData);
      }
    }

    initChartDefaults();
    tickClock();
    setInterval(tickClock, 1000);

    window._lastEngineRun = null;
    (async () => {
      const data = await loadData();
      if (data) {
        window.engineData = data;
        window._lastEngineRun = data.last_run;
        updateFooter(data);
      }
      await switchTab('overview', document.querySelector('.tab.active'));
    })();

    setInterval(async () => {
      const data = await loadData();
      if (!data) return;
      window.engineData = data;
      updateFooter(data);
      if (data.last_run !== window._lastEngineRun) {
        window._lastEngineRun = data.last_run;
        if (typeof window._pageInit === 'function') window._pageInit(data);
      }
    }, 10000);
  </script>
</body>

</html>
