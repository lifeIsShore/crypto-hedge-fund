<!-- ── QUANT RESEARCH TAB ─────────────────────────────────────────────────────── -->
<!-- Auto-loaded results panels (populated on init if data exists) -->
<div id="qr-results-panels" style="margin-bottom:14px;"></div>

<div class="panel" style="margin-bottom:14px;" id="pead-control-panel">
  <div class="panel-header">
    <span class="panel-title">PEAD ENGINE — RUN CONTROL</span>
    <span class="panel-tag" id="pead-last-run">LAST RUN: —</span>
  </div>
  <div class="panel-body">

    <!-- Options row -->
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;">

      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:10px;color:var(--text);">
        <input type="checkbox" id="pead-opt-refresh" style="accent-color:var(--accent);width:12px;height:12px;">
        FORCE REFRESH
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:10px;color:var(--text);">
        <input type="checkbox" id="pead-opt-backfill" style="accent-color:var(--accent);width:12px;height:12px;">
        REBUILD REGRESSIONS
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:10px;color:var(--text);">
        <input type="checkbox" id="pead-opt-outcomes" style="accent-color:var(--accent);width:12px;height:12px;">
        OUTCOMES ONLY
      </label>

      <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text);">
        <span>LOOKBACK</span>
        <select id="pead-opt-lookback"
          style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:3px 6px;font-family:var(--mono);font-size:10px;cursor:pointer;">
          <option value="90">90d</option>
          <option value="180">180d</option>
          <option value="365" selected>365d</option>
          <option value="540">540d</option>
        </select>
      </div>

      <!-- Spacer -->
      <div style="flex:1;"></div>

      <!-- Regime engine shortcut -->
      <button id="btn-run-regime" class="btn"
        onclick="if(window.peadRunRegime)window.peadRunRegime(false);else alert('Reload the tab')"
        style="font-size:10px;letter-spacing:.06em;padding:5px 12px;border-color:var(--muted);color:var(--muted);">
        ▶ REGIME ENGINE
      </button>

      <!-- Main run button -->
      <button id="btn-run-pead" class="btn"
        onclick="if(window.peadRunEngine)window.peadRunEngine();else alert('Reload the tab')"
        style="font-size:10px;letter-spacing:.06em;padding:5px 16px;border-color:var(--accent);color:var(--accent);font-weight:600;">
        ▶ RUN PEAD ENGINE
      </button>
    </div>

    <!-- Status bar -->
    <div id="pead-status-bar"
      style="display:none;border:1px solid var(--border);background:var(--surface2);padding:8px 10px;font-size:10px;color:var(--muted);min-height:32px;position:relative;">
      <span id="pead-status-text">Waiting…</span>
      <span id="pead-spinner"
        style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);">●</span>
    </div>

    <!-- Live results strip (shown after successful run) -->
    <div id="pead-results-strip" style="display:none;margin-top:10px;display:none;">
      <div style="font-size:9px;color:var(--muted);margin-bottom:6px;letter-spacing:.1em;">LAST RUN RESULTS</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;" id="pead-results-kpis"></div>
    </div>

    <!-- Log output (collapsible) -->
    <div id="pead-log-wrap" style="display:none;margin-top:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:9px;color:var(--muted);letter-spacing:.1em;">ENGINE LOG</span>
        <button class="btn" onclick="document.getElementById('pead-log-wrap').style.display='none'"
          style="font-size:9px;padding:2px 8px;border-color:var(--muted);color:var(--muted);">HIDE</button>
      </div>
      <pre id="pead-log-output" style="background:var(--bg);border:1px solid var(--border);padding:10px;font-size:9px;
               line-height:1.7;max-height:220px;overflow-y:auto;white-space:pre-wrap;
               color:var(--muted);font-family:var(--mono);"></pre>
    </div>

  </div>
</div>

<script>
  (function () {
    // ── Auto-load existing results on tab open ──────────────────────────────
    window._pageInit = async function() {
      await _qrAutoLoad();
    };

    async function _qrAutoLoad() {
      const panel = document.getElementById('qr-results-panels');
      if (!panel) return;
      panel.innerHTML = '<div style="font-size:9px;color:var(--muted);padding:4px 0;letter-spacing:.1em;">LOADING CACHED RESULTS…</div>';

      let peadState = null, regimeState = null;
      try {
        const pr = await fetch('/data/pead_state.json?' + Date.now());
        if (pr.ok) peadState = await pr.json();
      } catch(e) {}
      try {
        const rr = await fetch('/data/regime_state.json?' + Date.now());
        if (rr.ok) regimeState = await rr.json();
      } catch(e) {}

      if (!peadState && !regimeState) {
        panel.innerHTML = '<div style="font-size:9px;color:var(--muted);padding:6px 10px;border:1px solid var(--border);background:var(--surface);">No cached results — run the engines below to generate data.</div>';
        return;
      }

      let html = '';

      if (peadState) {
        const p = peadState.performance || {};
        const active = (peadState.active_setups || []);
        const gen = (peadState.generated_at || '').toString().slice(0,19).replace('T',' ');
        const hitRate = p.overall_hit_rate_21d != null ? (p.overall_hit_rate_21d*100).toFixed(1)+'%' : '—';
        const avgDrift = p.overall_avg_drift_21d != null ? (p.overall_avg_drift_21d>0?'+':'')+p.overall_avg_drift_21d.toFixed(2)+'%' : '—';
        const highHR = p.high_hit_rate_21d != null ? (p.high_hit_rate_21d*100).toFixed(1)+'%' : '—';
        const highDrift = p.high_avg_drift_21d != null ? (p.high_avg_drift_21d>0?'+':'')+p.high_avg_drift_21d.toFixed(2)+'%' : '—';

        html += `<div class="panel" style="margin-bottom:10px;">
          <div class="panel-header">
            <span class="panel-title">PEAD ENGINE — CACHED RESULTS</span>
            <span class="panel-tag">${gen || 'UNKNOWN DATE'}</span>
          </div>
          <div class="panel-body">
            <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;">
              ${_qrKpi('TOTAL SETUPS', p.total_setups||0, 'var(--text)')}
              ${_qrKpi('OVERALL HIT RATE', hitRate, parseFloat(hitRate)>=55?'var(--accent)':'var(--amber)')}
              ${_qrKpi('AVG DRIFT 21D', avgDrift, p.overall_avg_drift_21d>=0?'var(--accent)':'var(--red)')}
              ${_qrKpi('HIGH QUALITY HIT%', highHR, parseFloat(highHR)>=55?'var(--accent)':'var(--red)')}
              ${_qrKpi('ACTIVE SETUPS', active.length, active.length>0?'var(--accent)':'var(--muted)')}
            </div>
            ${active.length>0 ? `
            <div style="font-size:9px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px;">ACTIVE SETUPS NOW</div>
            <table class="data-table">
              <thead><tr><th>TICKER</th><th>EARNINGS DATE</th><th>SURPRISE</th><th>SURPRISE %</th><th>QUALITY</th><th>DRIFT 21D</th></tr></thead>
              <tbody>${active.slice(0,15).map(s => `<tr>
                <td style="color:var(--blue);font-weight:500">${s.ticker||'—'}</td>
                <td>${s.earnings_date||'—'}</td>
                <td style="color:${(s.surprise||0)>=0?'var(--accent)':'var(--red)'}">${s.surprise!=null?(s.surprise>=0?'+':'')+s.surprise.toFixed(3):'—'}</td>
                <td style="color:${(s.surprise_pct||0)>=0?'var(--accent)':'var(--red)'}">${s.surprise_pct!=null?(s.surprise_pct>=0?'+':'')+s.surprise_pct.toFixed(1)+'%':'—'}</td>
                <td><span class="tag ${s.quality==='HIGH'?'tag-green':s.quality==='LOW'?'tag-red':'tag-amber'}">${s.quality||'—'}</span></td>
                <td style="color:${(s.drift_21d||0)>=0?'var(--accent)':'var(--red)'}">${s.drift_21d!=null?(s.drift_21d>=0?'+':'')+s.drift_21d.toFixed(2)+'%':'PENDING'}</td>
              </tr>`).join('')}</tbody>
            </table>` : '<div style="font-size:10px;color:var(--muted);">No active PEAD setups at this time.</div>'}
          </div>
        </div>`;
      }

      if (regimeState) {
        const curr = regimeState.current_regime || {};
        const gen = (regimeState.generated_at || '').toString().slice(0,19).replace('T',' ');
        const regColor = curr.regime==='BULL'?'var(--accent)':curr.regime==='BEAR'?'var(--red)':'var(--amber)';
        html += `<div class="panel" style="margin-bottom:10px;">
          <div class="panel-header">
            <span class="panel-title">REGIME ENGINE — CACHED RESULTS</span>
            <span class="panel-tag">${gen||'UNKNOWN DATE'}</span>
          </div>
          <div class="panel-body">
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
              ${_qrKpi('CURRENT REGIME', curr.regime||'—', regColor)}
              ${_qrKpi('CONFIDENCE', curr.confidence!=null?(curr.confidence*100).toFixed(1)+'%':'—', 'var(--blue)')}
              ${_qrKpi('REGIME DAYS', curr.days_in_regime||'—', 'var(--text)')}
              ${_qrKpi('SUGGESTED BIAS', curr.bias||'—', regColor)}
            </div>
          </div>
        </div>`;
      }

      panel.innerHTML = html;

      // Update last-run tag if pead data exists
      if (peadState && peadState.generated_at) {
        const tag = document.getElementById('pead-last-run');
        if (tag) tag.textContent = 'LAST RUN: ' + (peadState.generated_at||'').toString().slice(11,16);
      }
    }

    function _qrKpi(label, val, color) {
      return `<div style="background:var(--surface2);border:1px solid var(--border);padding:8px 10px;">
        <div style="font-size:9px;color:var(--muted);margin-bottom:3px;letter-spacing:.08em;">${label}</div>
        <div style="font-size:15px;font-weight:600;color:${color};">${val}</div>
      </div>`;
    }

    window.peadRunEngine = async function () {
      const btn = document.getElementById('btn-run-pead');
      const regBtn = document.getElementById('btn-run-regime');
      const statusBar = document.getElementById('pead-status-bar');
      const statusTxt = document.getElementById('pead-status-text');
      const spinner = document.getElementById('pead-spinner');
      const logWrap = document.getElementById('pead-log-wrap');
      const logOut = document.getElementById('pead-log-output');

      const opts = {
        refresh: document.getElementById('pead-opt-refresh').checked,
        backfill: document.getElementById('pead-opt-backfill').checked,
        outcomes_only: document.getElementById('pead-opt-outcomes').checked,
        lookback: parseInt(document.getElementById('pead-opt-lookback').value, 10),
      };

      btn.disabled = true;
      regBtn.disabled = true;
      btn.textContent = '⏳ RUNNING…';
      btn.style.borderColor = 'var(--amber)';
      btn.style.color = 'var(--amber)';

      statusBar.style.display = 'block';
      statusTxt.textContent = 'Fetching data and running PEAD engine… this can take 1–3 minutes.';
      spinner.style.display = 'inline';
      logWrap.style.display = 'none';
      logOut.textContent = '';

      // Spinner animation
      const spinChars = ['●', '○', '◉', '○'];
      let si = 0;
      const spinTimer = setInterval(() => {
        spinner.textContent = spinChars[si++ % spinChars.length];
      }, 400);

      try {
        const res = await fetch('/api/run_pead_engine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(opts),
        });
        const data = await res.json();

        clearInterval(spinTimer);
        spinner.style.display = 'none';

        if (data.success) {
          statusTxt.textContent = '✅ Engine completed successfully.';
          statusTxt.style.color = 'var(--accent)';
          btn.textContent = '✓ DONE — RUN AGAIN';
          btn.style.borderColor = 'var(--accent)';
          btn.style.color = 'var(--accent)';

          // Update last-run tag
          document.getElementById('pead-last-run').textContent =
            'LAST RUN: ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

          // Show results if we got pead_state back
          if (data.pead_state) _peadShowResults(data.pead_state);
          // Also refresh the top cached results panel
          await _qrAutoLoad();

          // Show log
          if (data.log) {
            logOut.textContent = data.log;
            logWrap.style.display = 'block';
            logOut.scrollTop = logOut.scrollHeight;
          }
        } else {
          statusTxt.textContent = '❌ Engine error: ' + (data.error || 'Unknown error');
          statusTxt.style.color = 'var(--red)';
          btn.textContent = '▶ RUN PEAD ENGINE';
          btn.style.borderColor = 'var(--red)';
          btn.style.color = 'var(--red)';

          if (data.log) {
            logOut.textContent = data.log;
            logWrap.style.display = 'block';
          }
        }
      } catch (err) {
        clearInterval(spinTimer);
        spinner.style.display = 'none';
        statusTxt.textContent = '❌ Request failed: ' + err.message + ' — is the Flask server running?';
        statusTxt.style.color = 'var(--red)';
        btn.textContent = '▶ RUN PEAD ENGINE';
        btn.style.borderColor = 'var(--red)';
        btn.style.color = 'var(--red)';
      }

      btn.disabled = false;
      regBtn.disabled = false;
    };

    window.peadRunRegime = async function (backfill) {
      const btn = document.getElementById('btn-run-regime');
      const statusBar = document.getElementById('pead-status-bar');
      const statusTxt = document.getElementById('pead-status-text');
      const spinner = document.getElementById('pead-spinner');

      btn.disabled = true;
      btn.textContent = '⏳ REGIME…';
      statusBar.style.display = 'block';
      statusTxt.style.color = '';
      statusTxt.textContent = 'Running regime engine… ~1 minute.';
      spinner.style.display = 'inline';

      const spinChars = ['●', '○', '◉', '○'];
      let si = 0;
      const spinTimer = setInterval(() => { spinner.textContent = spinChars[si++ % spinChars.length]; }, 400);

      try {
        const res = await fetch('/api/run_regime_engine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ backfill }),
        });
        const data = await res.json();
        clearInterval(spinTimer);
        spinner.style.display = 'none';

        if (data.success) {
          statusTxt.textContent = '✅ Regime engine completed.';
          statusTxt.style.color = 'var(--accent)';
          btn.textContent = '✓ REGIME DONE';
        } else {
          statusTxt.textContent = '❌ Regime error: ' + (data.error || 'Unknown');
          statusTxt.style.color = 'var(--red)';
          btn.textContent = '▶ REGIME ENGINE';
        }
      } catch (err) {
        clearInterval(spinTimer);
        spinner.style.display = 'none';
        statusTxt.textContent = '❌ ' + err.message;
        statusTxt.style.color = 'var(--red)';
        btn.textContent = '▶ REGIME ENGINE';
      }

      btn.disabled = false;
    };

    function _peadShowResults(state) {
      const strip = document.getElementById('pead-results-strip');
      const kpis = document.getElementById('pead-results-kpis');
      const p = state.performance || {};

      const hitRate = p.overall_hit_rate_21d != null ? (p.overall_hit_rate_21d * 100).toFixed(1) + '%' : '—';
      const avgDrift = p.overall_avg_drift_21d != null ? (p.overall_avg_drift_21d > 0 ? '+' : '') + p.overall_avg_drift_21d.toFixed(2) + '%' : '—';
      const highHR = p.high_hit_rate_21d != null ? (p.high_hit_rate_21d * 100).toFixed(1) + '%' : '—';
      const highDrift = p.high_avg_drift_21d != null ? (p.high_avg_drift_21d > 0 ? '+' : '') + p.high_avg_drift_21d.toFixed(2) + '%' : '—';
      const active = (state.active_setups || []).length;

      const driftColor = (v) => {
        if (v == null) return 'var(--muted)';
        return parseFloat(v) >= 0 ? 'var(--accent)' : 'var(--red)';
      };

      kpis.innerHTML = [
        { label: 'TOTAL SETUPS', val: p.total_setups || 0, color: 'var(--text)' },
        { label: 'OVERALL HIT RATE', val: hitRate, color: parseFloat(hitRate) >= 55 ? 'var(--accent)' : 'var(--amber)' },
        { label: 'AVG DRIFT 21D', val: avgDrift, color: driftColor(p.overall_avg_drift_21d) },
        { label: 'HIGH QUALITY HIT%', val: highHR, color: parseFloat(highHR) >= 55 ? 'var(--accent)' : 'var(--red)' },
        { label: 'ACTIVE NOW', val: active, color: active > 0 ? 'var(--accent)' : 'var(--muted)' },
      ].map(({ label, val, color }) =>
        `<div style="background:var(--surface2);border:1px solid var(--border);padding:8px 10px;">
         <div style="font-size:9px;color:var(--muted);margin-bottom:3px;letter-spacing:.08em;">${label}</div>
         <div style="font-size:16px;font-weight:600;color:${color};">${val}</div>
       </div>`
      ).join('');

      strip.style.display = 'block';
    }
  })();
</script>
