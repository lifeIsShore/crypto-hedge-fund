<!-- ── HISTORY TAB ─────────────────────────────────────────────────────────── -->
<style>
  .hist-kpi-strip { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
  .trade-row-buy  { border-left:2px solid var(--accent); }
  .trade-row-sell { border-left:2px solid var(--red); }
  .trade-row-dep  { border-left:2px solid var(--blue); }
  .trade-row-fee  { border-left:2px solid var(--muted); }
</style>

<!-- KPI strip -->
<div class="hist-kpi-strip" id="hist-kpis"></div>

<!-- Equity curve -->
<div class="panel" style="margin-bottom:14px;">
  <div class="panel-header">
    <span class="panel-title">PORTFOLIO EQUITY CURVE</span>
    <span class="panel-tag" id="hist-curve-tag">BACKTEST RETURNS</span>
  </div>
  <div class="panel-body" style="padding-bottom:20px;">
    <div style="position:relative;height:280px;"><canvas id="histEquityChart"></canvas></div>
  </div>
</div>

<!-- Return distribution -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">DAILY RETURN DISTRIBUTION</span>
      <span class="panel-tag">HISTOGRAM</span>
    </div>
    <div class="panel-body"><div style="position:relative;height:200px;"><canvas id="histReturnDist"></canvas></div></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">ROLLING 30D VOLATILITY</span>
      <span class="panel-tag">ANNUALISED</span>
    </div>
    <div class="panel-body"><div style="position:relative;height:200px;"><canvas id="histRollingVol"></canvas></div></div>
  </div>
</div>

<!-- Ledger / trade log -->
<div class="panel" style="margin-bottom:14px;">
  <div class="panel-header">
    <span class="panel-title">TRANSACTION LEDGER</span>
    <span class="panel-tag" id="hist-ledger-tag">LOADING…</span>
  </div>
  <div class="panel-body">
    <table class="data-table" id="hist-ledger-table">
      <thead>
        <tr>
          <th>DATE</th><th>ACTION</th><th>TICKER</th>
          <th>QTY</th><th>PRICE</th><th>TOTAL (€)</th><th>NOTES</th>
          <th style="text-align:right">RUNNING CASH</th>
        </tr>
      </thead>
      <tbody id="hist-ledger-tbody">
        <tr><td colspan="8" style="color:var(--muted)">Loading ledger…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
(function() {
  let _histCharts = {};

  function destroyCharts() {
    Object.values(_histCharts).forEach(c => { try { c.destroy(); } catch(e){} });
    _histCharts = {};
  }

  window._pageInit = function(data) {
    destroyCharts();
    if (data) _render(data);
  };

  function _render(data) {
    const kpis = data.kpis || {};
    const returns = data.portfolio_returns || [];

    _renderKpis(kpis, returns);
    _renderEquityCurve(returns, kpis);
    _renderReturnDist(returns);
    _renderRollingVol(returns);
    _loadLedger();
  }

  function _renderKpis(kpis, returns) {
    const net = kpis.net_pnl != null ? kpis.net_pnl : null;
    const gross = kpis.gross_pnl != null ? kpis.gross_pnl : null;
    const fees = kpis.total_fees != null ? kpis.total_fees : null;
    const realRet = kpis.real_return_pct != null ? kpis.real_return_pct : null;
    const maxDD = kpis.max_drawdown != null ? kpis.max_drawdown * 100 : null;
    const vol = kpis.ann_volatility_pct != null ? kpis.ann_volatility_pct : null;

    function fmt(v, dec, prefix, suffix) {
      if (v == null) return '—';
      return (v >= 0 ? prefix : '') + v.toFixed(dec) + suffix;
    }
    function fmtSign(v, dec, suffix) {
      if (v == null) return '—';
      return (v >= 0 ? '+' : '') + v.toFixed(dec) + suffix;
    }

    document.getElementById('hist-kpis').innerHTML = [
      { label:'TOTAL TRADES',  val: returns.length + '',         color:'var(--text)',  sub:'daily observations' },
      { label:'NET P&L',       val: net!=null ? '€'+net.toFixed(2):  '—', color: net>=0?'var(--accent)':'var(--red)',   sub:'after fees' },
      { label:'REAL RETURN',   val: realRet!=null ? fmtSign(realRet,2,'%') : '—', color: realRet>=0?'var(--accent)':'var(--red)', sub:'on invested capital' },
      { label:'MAX DRAWDOWN',  val: maxDD!=null ? maxDD.toFixed(2)+'%' : '—', color:'var(--red)',    sub:'peak-to-trough' },
      { label:'ANN. VOL',      val: vol!=null ? vol.toFixed(2)+'%' : '—',   color:'var(--amber)',  sub:'annualised' },
    ].map(({label,val,color,sub}) =>
      `<div class="kpi"><div class="kpi-label">${label}</div>
       <div class="kpi-value" style="color:${color};font-size:16px;">${val}</div>
       <div class="kpi-sub">${sub}</div></div>`
    ).join('');
  }

  function _renderEquityCurve(returns, kpis) {
    const initial = (kpis.initial_investment || 300);
    let equity = initial;
    const labels = [], values = [];
    // Starting point
    labels.push('Start');
    values.push(parseFloat(initial.toFixed(2)));
    returns.forEach((r, i) => {
      equity *= (1 + r);
      labels.push('D' + (i + 1));
      values.push(parseFloat(equity.toFixed(2)));
    });

    const finalVal = kpis.current_value || values[values.length - 1];
    document.getElementById('hist-curve-tag').textContent =
      values.length + ' DATAPOINTS · FINAL €' + parseFloat(finalVal).toFixed(2);

    _histCharts.equity = new Chart(document.getElementById('histEquityChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: 'var(--accent)',
          borderWidth: 1.5,
          backgroundColor: 'rgba(0,229,160,0.08)',
          fill: true,
          pointRadius: 0,
          tension: 0.3,
        }, {
          // Baseline (initial investment)
          data: new Array(values.length).fill(initial),
          borderColor: 'rgba(74,85,104,0.5)',
          borderWidth: 1,
          borderDash: [4, 4],
          pointRadius: 0,
          fill: false,
          label: 'Invested',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => '€' + ctx.parsed.y.toFixed(2),
              title: ctx => ctx[0].label,
            }
          }
        },
        scales: {
          x: {
            ticks: {
              maxTicksLimit: 12,
              callback: (_, i) => {
                // Only show every Nth label
                const step = Math.max(1, Math.floor(labels.length / 12));
                return i % step === 0 ? labels[i] : '';
              },
            },
            grid: { display: false },
          },
          y: {
            ticks: { callback: v => '€' + v.toFixed(0) },
            grid: { color: 'rgba(255,255,255,0.04)' },
          }
        }
      }
    });
  }

  function _renderReturnDist(returns) {
    if (!returns.length) return;
    // Build 20-bin histogram
    const pct = returns.map(r => r * 100);
    const min = Math.min(...pct), max = Math.max(...pct);
    const bins = 20;
    const binSize = (max - min) / bins;
    const counts = new Array(bins).fill(0);
    const binLabels = [];
    for (let i = 0; i < bins; i++) {
      binLabels.push((min + i * binSize).toFixed(2) + '%');
    }
    pct.forEach(v => {
      const idx = Math.min(bins - 1, Math.floor((v - min) / binSize));
      counts[idx]++;
    });
    const colors = binLabels.map((l) => parseFloat(l) >= 0 ? 'rgba(0,229,160,0.7)' : 'rgba(255,77,109,0.7)');

    _histCharts.dist = new Chart(document.getElementById('histReturnDist'), {
      type: 'bar',
      data: {
        labels: binLabels,
        datasets: [{ data: counts, backgroundColor: colors, borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ctx.raw + ' days' } } },
        scales: {
          x: { ticks: { maxTicksLimit: 7, maxRotation: 35, font: { size: 8 } }, grid: { display: false } },
          y: { ticks: { font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  function _renderRollingVol(returns) {
    if (returns.length < 5) return;
    const WINDOW = 30;
    const labels = [], vols = [];
    for (let i = WINDOW; i <= returns.length; i++) {
      const slice = returns.slice(i - WINDOW, i);
      const mean = slice.reduce((a, b) => a + b, 0) / slice.length;
      const variance = slice.reduce((a, r) => a + (r - mean) ** 2, 0) / (slice.length - 1);
      vols.push(parseFloat((Math.sqrt(variance) * Math.sqrt(252) * 100).toFixed(2)));
      labels.push('D' + i);
    }

    _histCharts.vol = new Chart(document.getElementById('histRollingVol'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: vols,
          borderColor: 'var(--amber)',
          borderWidth: 1.5,
          backgroundColor: 'rgba(245,166,35,0.08)',
          fill: true,
          pointRadius: 0,
          tension: 0.3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 8, font: { size: 8 } }, grid: { display: false } },
          y: { ticks: { callback: v => v.toFixed(1) + '%', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  async function _loadLedger() {
    const tbody = document.getElementById('hist-ledger-tbody');
    const tag = document.getElementById('hist-ledger-tag');
    try {
      const r = await fetch('/data/ledger.csv?' + Date.now());
      const text = await r.text();
      const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));

      // Skip header row
      const dataLines = lines.filter(l => !l.startsWith('Date,'));

      if (!dataLines.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted)">No transactions yet.</td></tr>';
        tag.textContent = '0 TRANSACTIONS';
        return;
      }

      let runningCash = 0;
      const rows = dataLines.map(line => {
        const cols = line.split(',');
        const [date, action, ticker, qty, price, total, ...notesParts] = cols;
        const notes = notesParts.join(',').trim();
        const totalNum = parseFloat(total) || 0;

        if (action === 'Deposit' || action === 'Dividend') runningCash += totalNum;
        else if (action === 'Buy') runningCash -= totalNum;
        else if (action === 'Sell') runningCash += totalNum;
        else if (action === 'Fee') runningCash -= totalNum;

        const rowClass = action === 'Buy' ? 'trade-row-buy' :
                         action === 'Sell' ? 'trade-row-sell' :
                         action === 'Deposit' ? 'trade-row-dep' : 'trade-row-fee';

        const actionColor = action === 'Buy' ? 'var(--accent)' :
                            action === 'Sell' ? 'var(--red)' :
                            action === 'Deposit' ? 'var(--blue)' : 'var(--muted)';

        return `<tr class="${rowClass}">
          <td style="color:var(--muted)">${(date||'').trim()}</td>
          <td><span class="tag" style="background:rgba(0,0,0,.2);color:${actionColor};border-color:${actionColor};">${(action||'').trim()}</span></td>
          <td style="font-weight:500;color:var(--blue)">${(ticker||'').trim()}</td>
          <td>${qty ? parseFloat(qty).toFixed(4) : '—'}</td>
          <td>${price ? '€' + parseFloat(price).toFixed(2) : '—'}</td>
          <td style="color:${action==='Buy'||action==='Fee'?'var(--red)':'var(--accent)'}">
            ${totalNum ? (action==='Buy'||action==='Fee'?'-':'+'+'') + '€' + totalNum.toFixed(2) : '—'}
          </td>
          <td style="color:var(--muted);font-size:10px;">${notes||'—'}</td>
          <td style="text-align:right;color:${runningCash>=0?'var(--accent)':'var(--red)'}">€${runningCash.toFixed(2)}</td>
        </tr>`;
      });

      tbody.innerHTML = rows.join('');
      tag.textContent = dataLines.length + ' TRANSACTIONS';
    } catch(e) {
      tbody.innerHTML = `<tr><td colspan="8" style="color:var(--red)">Failed to load ledger: ${e.message}</td></tr>`;
      tag.textContent = 'ERROR';
    }
  }

  // Init on load
  if (window.engineData) window._pageInit(window.engineData);
})();
</script>
