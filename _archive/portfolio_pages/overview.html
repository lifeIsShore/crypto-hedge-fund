<!-- ── OVERVIEW ────────────────────────────────────── -->
<div class="kpi-strip" id="kpiStrip">
  <div class="kpi c-muted"><div class="kpi-label">TOTAL VALUE</div><div class="kpi-value">—</div></div>
  <div class="kpi c-muted"><div class="kpi-label">NET P&L</div><div class="kpi-value">—</div></div>
  <div class="kpi c-muted"><div class="kpi-label">SHARPE RATIO</div><div class="kpi-value">—</div></div>
  <div class="kpi c-muted"><div class="kpi-label">MAX DRAWDOWN</div><div class="kpi-value">—</div></div>
  <div class="kpi c-muted"><div class="kpi-label">INFO RATIO</div><div class="kpi-value">—</div></div>
</div>

<div class="signal-box" id="signalBox">
  <div class="signal-title">ACTION SIGNAL</div>
  <div class="signal-text" id="signalText">Loading...</div>
  <div class="signal-reasons" id="signalReasons"></div>
</div>

<div class="grid-2">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">CURRENT HOLDINGS</span>
      <span class="panel-tag" id="nextRebalTag">NEXT REBALANCE —</span>
    </div>
    <div class="panel-body">
      <table class="data-table">
        <thead><tr><th>ASSET</th><th>VALUE</th><th>WEIGHT</th><th>STATUS</th></tr></thead>
        <tbody id="holdingsBody"><tr><td colspan="4" style="color:var(--muted)">Loading...</td></tr></tbody>
      </table>
      <div style="margin-top:12px;font-size:10px;color:var(--muted);">
        CASH <span style="color:var(--text);margin-left:8px;">€<span id="cashValue">0.00</span></span>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">MARKET PRICES</span>
      <span class="panel-tag">XETRA · NYSE</span>
    </div>
    <div class="panel-body">
      <table class="data-table">
        <thead><tr><th>TICKER</th><th>PRICE (€)</th><th>UPDATED</th></tr></thead>
        <tbody id="pricesBody"><tr><td colspan="3" style="color:var(--muted)">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span class="panel-title">PORTFOLIO ALLOCATION</span>
    <span class="panel-tag">CURRENT VS OPTIMAL</span>
  </div>
  <div class="panel-body">
    <div style="position:relative;height:160px;"><canvas id="weightsChart"></canvas></div>
  </div>
</div>

<script>
window._pageInit = function(data) {
  renderKPIs(data);
  renderSignal(data);
  renderHoldings(data);
  renderPrices(data);
  renderWeightsChart(data);
};
</script>
