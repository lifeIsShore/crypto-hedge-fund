{% extends "base.html" %}

{% block title %}Legal & Compliance{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  .legal-container {
    max-width: 800px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 4px;
  }
  
  .legal-content {
    font-family: var(--sans);
    line-height: 1.6;
    color: var(--text);
    font-size: 14px;
  }
  
  .legal-content h1 {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 24px;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  
  .legal-content h2 {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--text);
    margin-top: 32px;
    margin-bottom: 16px;
  }
  
  .legal-content h3 {
    font-size: 15px;
    color: var(--muted);
    margin-top: 24px;
    margin-bottom: 12px;
  }
  
  .legal-content p, .legal-content li {
    margin-bottom: 12px;
    color: #ccc;
  }
  
  html.light-theme .legal-content p, 
  html.light-theme .legal-content li {
    color: #444;
  }

  .legal-content ul, .legal-content ol {
    margin-left: 20px;
    margin-bottom: 16px;
  }
  
  .legal-content blockquote {
    border-left: 4px solid var(--accent3);
    background: rgba(245,166,35, 0.05);
    padding: 12px 16px;
    margin: 20px 0;
    color: var(--accent3);
    font-style: italic;
  }
  
  .legal-content hr {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 32px 0;
  }
  
  .legal-content strong {
    color: var(--text);
    font-weight: 600;
  }
</style>
{% endblock %}

{% block content %}
<div class="legal-container">
  <div id="markdown-container" class="legal-content"></div>
</div>

<script>
  // Render markdown securely via marked.js
  const markdownContent = {{ content | tojson | safe }};
  document.getElementById('markdown-container').innerHTML = marked.parse(markdownContent);
</script>
{% endblock %}
